# HP Printers dashboard
#
# Copy into a Lovelace view (YAML mode), or save as a dashboard under
# Settings -> Dashboards.
#
# ---------------------------------------------------------------------------
# 需要改的地方只有两处，都在下面的 picture-entity 卡片里：
#   1. image: 打印机自己的 IP（或主机名）
#   2. entity: 那台打印机的状态实体
# 其余全部按 device / translation_key 过滤，改名不会失效。
# ---------------------------------------------------------------------------
#
# 为什么要用打印机自带的图
# ----------------------------
# 每台 HP 都自带一张 512x512 的整机渲染图，直接取它自己的 web 服务即可：
#
#     http://<打印机地址>/images/printer-large.png
#
# 好处是不用托管任何图片、改固件也不会失效，图片永远和机器对得上。
# 代价是 Home Assistant 必须能直连打印机的 http 端口（631 之外的 80）。
#
# 如果 HA 跑在 Docker 里并且用了 host 网络，直接可用；用 bridge 网络时，
# 把 `network_mode: host` 加上，否则 HA 解析不到打印机 IP。
#
# ---------------------------------------------------------------------------
# 口径提醒（这一条最容易踩）
# ----------------------------
# `printer_total_pages` 在两种协议下含义不同：
#   * LEDM（大多数机型）= 引擎页面总数，设备一辈子转过的页，
#     含卡纸 / 重试 / 复印 / 扫描 / 校准，EWS 明示「从不重置」。
#   * CDP（少数新机型）= 黑白 + 彩色，也就是用户实际打印量。
# 要做长期统计，用 `printer_mono_pages` + `printer_color_pages`，
# 那两个在两种协议下口径一致，可以相加。
#
# 另外 `cartridge_level` 对墨槽（inkTank）返回 100 是设备的**占位值**，
# 不是测量值——墨槽没有液位传感器。做低墨告警前先看 `consumable_type`
# 是不是 inkCartridge。

title: HP 打印机
views:
  - title: 打印机
    path: printers
    icon: mdi:printer
    type: masonry
    cards:
      # ============================================================== 外观
      # picture-entity 的 entity 是写死的，改名打印机后只有这一处要跟着改。
      # 换成「状态」那个实体即可（名字里带打印机名 + Status）。
      - type: picture-entity
        entity: sensor.192_168_9_20_status
        image: http://192.168.9.20/images/printer-large.png
        name: 客厅 HP Smart Tank 750
        show_entity_picture: false

      - type: picture-entity
        entity: sensor.192_168_9_12_status
        image: http://192.168.9.12/images/printer-large.png
        name: 卧室 HP Smart Tank 580
        show_entity_picture: false

      # ============================================================== 状态
      - type: entities
        title: 状态
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - accepting_jobs
                    - quiet_mode
                    - auto_jam_recovery
                    - admin_password_set
            sort:
              method: label

      - type: custom:auto-entities
        title: 状态
        show_header_toggle: false
        filter:
          - integration: hp_printers
            domain: sensor
            entity:
              translation_key:
                - status
                - scanner_status
                - calibration_result
        sort:
          method: label

      # ============================================================== 纸
      - type: entities
        title: 纸张
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - paper_level
                    # 实际装载的纸（尺寸 / 类型，按纸盒列）。这条以前完全没有：
                    # CDP 的介质文档一直没被打开，而 LEDM 的有。
                    - media_loaded
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - paper_low
                    - paper_present

      # ============================================================== 墨
      # 耗材是独立子设备（每支墨盒一个），所以单独一张卡，
      # 这样四个颜色会自己归到一起，而不是散在打印机自己的实体里。
      - type: entities
        title: 耗材
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - cartridge_level
                    - cartridge_raw_level
                    - cartridge_pages_remaining
                    - cartridge_low_threshold
                    - cartridge_part_number
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - cartridge_problem
                    - cartridge_genuine
                    - cartridge_previously_used
                    - cartridge_refilled
            sort:
              method: label

      # ============================================================== 用量
      - type: entities
        title: 用量
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - printer_mono_pages
                    - printer_color_pages
                    - printer_simplex_sheets
                    - printer_duplex_sheets
                    - printer_jams
                    - printer_mispicks
                    - scanner_images
                    - scanner_flatbed_images
                    - scanner_adf_images
                    - scanner_jams
                    - scanner_mispicks
                    - copy_total_pages
                    - panel_button_presses
                    - panel_cancel_presses
                    - marking_agent_used
                    # 打印头喷出的总滴数（各工位相加）。
                    - printhead_hp_drops
                    # 维修期间喷的滴数。
                    - printhead_service_drops
                    # 网络 / 无线之外的另外两条打印去向，设备各记一个计数器。
                    - cloud_printed_pages
                    - subscription_printed_pages
            sort:
              method: label

      # ============================================================== 健康
      - type: entities
        title: 健康
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - firmware_fault
                    - low_ink_messaging
                    - genuine_supplies_only
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - last_event_code
                    - last_event_page
                    - power_cycles
                    - non_hp_flag_count
                    # 校准「进行到哪」和「上次结果」是两个问题：
                    # 机器可以正卡在 ScanRequested 等你把校准图放到扫描台上，
                    # 而上次结果仍然是 unknown / passed。
                    - calibration_state
                    # 上次更新为什么失败——状态行只说失败，不说原因，
                    # 而原因才是诊断。manifestNotFound 是「根本找不到固件」。
                    - firmware_update_failure_reason
                    # 打印头自己记的账：非 HP 墨滴数。克隆芯片会报真部件号，
                    # 所以「墨盒自称原装」和「打印头的账」是两回事，后者更硬。
                    - printhead_non_hp_drops
            sort:
              method: label

      # ============================================================== 身份
      - type: entities
        title: 设备
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - printer_installed_at
                    - printer_manufactured_at
                    - firmware_date
                    - auto_off_time
                    - power_save_timeout
                    - language_pack_version
            sort:
              method: label

      # ============================================================== 安全
      # 每一项都是打印机自己开着的东西，能让网段里的别的东西找到它。
      # 都不是故障——多数机型默认就是开的，机器也完全正常工作——但它们是
      # 「这台东西暴露了吗」的唯一答案，集成里别的部分都看不到。
      - type: entities
        title: 安全
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - snmp_public
                    - bluetooth_beaconing
                    - auto_update_enabled
                    # 9100 原始打印：没有驱动、没有作业结构、没有认证。
                    - port_9100_enabled
                    # 关掉重定向意味着 EWS 走明文 HTTP，密码每次过网都是裸的。
                    - https_redirection
            sort:
              method: label
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - print_services
                    - adapter_errors
                    - certificate_expires
                    # 无线加密方式。**该设备同时以明文返回网络名和密码，
                    # 集成两者都不读**，这里和诊断下载里都不会出现。
                    - wifi_encryption
                    # 登录预算的另一半：成功次数。不读它的话，
                    # 「失败 3 次」和「还剩 3 次」看起来一模一样。
                    - successful_attempts_remaining
                    - http_proxy_enabled
            sort:
              method: label

      # ============================================================== 设置
      # 开机设置清单。校准报 failed 时先看这里：pending 的那一步就是原因，
      # 打印头没坏，是这一步从没做完。
      - type: entities
        title: 设置进度
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - setup_state
                    - firmware_update_result
                    - firmware_update_available
            sort:
              method: label
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    - setup_incomplete
                    - firmware_update_failed
            sort:
              method: label

      # ============================================================== 告警
      # 事件日志是历史，这个是当下。一条干净的事件日志配上活跃告警，
      # 意味着机器没坏但正在抱怨——只看计数器组合是看不出来的。
      - type: entities
        title: 当前告警
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - active_alert_count
                    - active_alert_worst
                    # **告警说的是哪个颜色。** 类别名本身没法行动，
                    # 颜色藏在告警的嵌套 detail 块（LEDM）或指向耗材文档的
                    # 指针（CDP）里。实测一台机器同时为 Black / Magenta /
                    # Yellow 各报一条，没有这一项就只能看到「genuineHP」。
                    - supply_alert_colors
                    - carriage_status
                    - internet_diagnostics

      # ============================================================== 维护按钮
      # 点一下才会跑。每次都烧墨和纸，所以只能是人点的。
      - type: entities
        title: 维护操作
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: button

      # ============================================================== 作业
      # 接过的作业数 ≠ 打印成功。3 成功 / 4 失败 对 7039 个作业，
      # 单看总数读起来像「打印了 7039 次」，拆分才有健康含义。
      - type: entities
        title: 作业
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - print_jobs
                    - job_successes
                    - job_failures
                    - job_cancelled
                    - job_skipped
                    - network_printed_pages
                    - wireless_printed_pages
            sort:
              method: label

      # ============================================================== 硬件
      - type: entities
        title: 硬件
        show_header_toggle: false
        collapsed: true
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity:
                  translation_key:
                    - input_trays
                    - output_bins
                    - memory_total
                    - memory_available
                    - country_region
                    - device_language
                    - default_orientation
            sort:
              method: label
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: binary_sensor
                entity:
                  translation_key:
                    # 装了双面器 和 自动双面开着 是两个问题。
                    # 装了双面器、关着自动双面、却打过上万张双面页的机器真实存在。
                    - duplexer_installed
                    - auto_duplex_enabled

      # ============================================================== 排障
      - type: entities
        title: 诊断
        collapsed: true
        show_header_toggle: false
        entities:
          - type: custom:auto-entities
            filter:
              - integration: hp_printers
                domain: sensor
                entity_category: diagnostic
            sort:
              method: label
